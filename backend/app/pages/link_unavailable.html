<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="https://linkhub-five-theta.vercel.app/favicon.svg">
  <title>Link unavailable · LinkHub</title>
  <style>
    :root { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #193d36; background: #f4f5ef; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    .page { max-width: 1040px; margin: auto; padding: 36px 24px; }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 23px; font-weight: 750; letter-spacing: -1px; }
    .brand-mark { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 11px; background: #184f46; color: white; }
    main { max-width: 620px; margin: clamp(40px, 12vh, 120px) auto; padding: clamp(24px, 6vw, 48px); background: white; border: 1px solid #e1e6dc; border-radius: 22px; box-shadow: 0 16px 55px #193d3608; }
    .eyebrow { margin: 0; font-size: 12px; font-weight: 750; letter-spacing: 2px; color: #537067; }
    h1 { margin: 20px 0; font-size: clamp(32px, 6vw, 48px); line-height: 1.12; letter-spacing: -1.5px; overflow-wrap: anywhere; }
    .description { margin: 0 0 28px; color: #586b63; font-size: 17px; line-height: 1.7; }
    .button { display: inline-block; padding: 14px 22px; border-radius: 8px; background: #184f46; color: white; font-weight: 650; text-decoration: none; }
    .button:hover { background: #103e36; }
    .button:focus-visible { outline: 3px solid #184f46; outline-offset: 4px; }
    .hint { margin: 24px 0 0; font-size: 14px; line-height: 1.7; color: #63736b; }
    @media (max-width: 400px) { .page { padding: 24px 16px; } }
  </style>
</head>
<body>
  <div class="page">
    <header class="brand"><span class="brand-mark" aria-hidden="true">↗</span> LinkHub</header>
    <main>
      <p class="eyebrow">404 · LINK UNAVAILABLE</p>
      <h1>This link is unavailable</h1>
      <p class="description">This link may have expired, been disabled, or been removed.</p>
      <a class="button" href="https://linkhub-five-theta.vercel.app/">Go to LinkHub</a>
      <p class="hint">Expecting something here? Ask the person who shared this link for an updated one.</p>
    </main>
  </div>
</body>
</html>
