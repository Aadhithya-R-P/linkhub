[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "email-validator>=2.3.0",
    "fastapi[standard]>=0.141.1",
    "psycopg[binary]>=3,<4",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.12,<3",
    "sqlalchemy>=2.0,<2.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
